name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Validate Prisma Schema
        working-directory: apps/api
        run: npx prisma validate --config prisma7.config.ts

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate --config prisma7.config.ts

      - name: Lint API
        working-directory: apps/api
        run: npx eslint "src/**/*.ts" "prisma/**/*.ts" "test/**/*.ts"

      - name: Typecheck API
        working-directory: apps/api
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck Web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Lint Web
        working-directory: apps/web
        run: npm run lint

      - name: Run API tests
        run: npm run test:api

      - name: Dependency audit (report only)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          BACKEND_INTERNAL_URL: http://localhost:4000/api
          NEXT_PUBLIC_ENABLE_LOCAL_BOOK_FALLBACK: 'false'

  migrations:
    name: Migrations apply cleanly and match schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply all migrations to an empty database
        working-directory: apps/api
        run: npx prisma migrate deploy --config prisma7.config.ts
      - name: Fail if schema.prisma drifted from migrations
        working-directory: apps/api
        run: npx prisma migrate diff --config prisma7.config.ts --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      BACKEND_INTERNAL_URL: http://localhost:4000/api
      NEXT_PUBLIC_ENABLE_LOCAL_BOOK_FALLBACK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:shared
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build web
        working-directory: apps/web
        run: npx next build
      - name: Run Playwright
        working-directory: apps/web
        run: npx playwright test --project=${{ matrix.browser }} --timeout=180000
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
