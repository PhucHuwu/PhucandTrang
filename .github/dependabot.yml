version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Pinned on purpose (see cafb18a): react-konva >= 19.3 crashes the admin page editor
      - dependency-name: react-konva
      - dependency-name: konva

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
